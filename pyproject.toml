[project]
name = "minfer"
version = "0.1.0"
description = "Educational single-device LLM inference with continuous decode batching"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["torch>=2.14.1,<2.15", "transformers>=5.18.0,<5.19", "tokenizers>=0.23.2,<0.24"]

[project.scripts]
minfer = "minfer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minfer"]

[tool.hatch.build.targets.sdist]
include = ["src/minfer", "benchmarks", "examples", "tests", "README.md", "pyproject.toml", "uv.lock", ".python-version", ".gitignore"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: loads the canonical Qwen checkpoint", "mps: requires Apple MPS"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
